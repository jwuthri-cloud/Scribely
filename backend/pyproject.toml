[project]
name = "scribely-backend"
version = "0.1.0"
description = "A FastAPI + Next.js AI agent application with OpenRouter - Backend API"
authors = [
    {name = "Julien wuthrich", email = "julien.wut@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
keywords = ["fastapi", "api", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    # FastAPI and ASGI server
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    # Data validation and settings
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database support
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.7",
    "sqlalchemy[asyncio]>=2.0.23",
    "alembic>=1.13.0",
    # CORS and multipart support
    "python-multipart>=0.0.6",
    # Environment and configuration
    "python-dotenv>=1.0.0",
    # HTTP client
    "httpx>=0.25.2",
    "requests>=2.31.0",
    # Authentication and JWT
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    # LangChain for LLM integration
    "langchain>=1.2.6",
    "langchain-openai>=1.1.7",
    "langchain-core>=1.2.7",
    "langgraph>=1.0.5",
    # LLM Observability
    "langfuse>=3.12.0",
    # Agent Training (APO, VERL, SFT)
    "agentlightning>=0.3.0",
    # Logging
    "rich>=13.7.0",
    "python-json-logger>=2.0.7",
    # Rate limiting (Redis storage for multi-instance deployments)
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    # Vector database (LangChain integration)
    "langchain-pinecone>=0.2.0",
    "aiosqlite>=0.22.1",
    # Async file I/O for meeting upload storage
    "aiofiles>=24.1.0",
    # S3-compatible object storage (MinIO, AWS S3, R2)
    "boto3>=1.35.0",
    # Diarization providers
    "deepgram-sdk>=3.0.0",
    "assemblyai>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "poethepoet>=0.25.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "httpx>=0.25.2",
]

test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.2",
]

[project.scripts]
scribely = "app.cli.main:cli"

[project.urls]
Homepage = "https://github.com/julienwuthrich/scribely"
Repository = "https://github.com/julienwuthrich/scribely"
Issues = "https://github.com/julienwuthrich/scribely/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "W", "B", "I"]
ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=html --cov-report=term-missing"

[tool.poe.tasks]
run = { cmd = "scribely server start --reload", help = "Start the FastAPI server with hot reload" }
migrate = { cmd = "scribely database migrate", help = "Run Alembic migrations (create/update schema)" }
db-status = { cmd = "scribely database status", help = "Check database connection and schema status" }
db-reset = { cmd = "scribely database reset --force", help = "Reset database (drop all tables, recreate schema)" }
db-seed = { cmd = "scribely database seed", help = "Seed database with sample data" }
test = { cmd = "pytest", help = "Run tests" }
test-cov = { cmd = "pytest --cov=app --cov-report=term-missing", help = "Run tests with coverage report" }
diarize = { cmd = "python scripts/test_diarization.py", help = "Test diarization on a media file (e.g. poe diarize /path/to/file.mp4 --provider deepgram)" }
diarize-full = { cmd = "python scripts/test_diarization.py --full", help = "Full pipeline: diarize + frames + LLM speaker ID (e.g. poe diarize-full /path/to/file.mp4)" }
