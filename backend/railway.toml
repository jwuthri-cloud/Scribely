# Railway config-as-code: https://docs.railway.app/reference/config-as-code
#
# Docker build expects the Git repository root as the build context (default when
# "Root Directory" is empty). Set Dockerfile path to: backend/Dockerfile
# Do NOT set Root Directory to backend/ unless you revert the Dockerfile to COPY
# from the service root only (see backend/Dockerfile header comment).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# One array element max (Railway schema); use venv so `alembic` is on PATH
preDeployCommand = ['/bin/sh -c "cd /app && /app/.venv/bin/python -m alembic upgrade head"']
# Same as Dockerfile CMD: no reliance on PATH for `uvicorn` (Railway often uses a stripped PATH)
startCommand = '/bin/sh -c "exec /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"'
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
