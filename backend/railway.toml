# Railway config-as-code: https://docs.railway.app/reference/config-as-code
#
# Docker build expects the Git repository root as the build context (default when
# "Root Directory" is empty). Set Dockerfile path to: backend/Dockerfile
# Do NOT set Root Directory to backend/ unless you revert the Dockerfile to COPY
# from the service root only (see backend/Dockerfile header comment).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Migrations run in scripts/docker-entrypoint.sh before uvicorn (same as Dockerfile CMD).
# preDeploy is optional; entrypoint covers hosts where preDeploy does not run.
startCommand = '/bin/sh -c "exec /app/scripts/docker-entrypoint.sh"'
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
