name: Backend Tests & Quality

on:
  push:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

env:
  PYTHON_VERSION: "3.13.9"
  SECRET_KEY: "test-secret-key-very-long-and-secure-for-testing-purposes"
  ENVIRONMENT: "testing"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: black
        run: black --check .
      - name: isort
        run: isort --check-only .
      - name: ruff (syntax errors, undefined names, broken asserts/comparisons)
        run: ruff check . --select E9,F63,F7,F82

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e . pip-audit bandit
      - name: bandit (medium+ severity; examples/ are not shipped)
        run: bandit -r app -x app/examples -ll -ii
      - name: pip-audit (report only — upstream CVEs must not block merges)
        run: pip-audit
        continue-on-error: true

  tests:
    # Tests run on in-memory SQLite (tests/conftest.py); no Postgres/Redis needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: unit tests (coverage gate from pytest.ini)
        run: pytest tests/unit --cov=app --cov-report=xml --junitxml=pytest-unit.xml
      - name: integration tests
        run: pytest tests/integration --cov=app --cov-append --cov-fail-under=0 --junitxml=pytest-integration.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/pytest-*.xml
            backend/coverage.xml
          if-no-files-found: ignore
