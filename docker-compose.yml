# Local stack mirrors Railway prod (MainApp): Redis + Postgres + MinIO + AssistMe(backend) + Frontend.
# `docker compose up --build` brings up the whole stack; the backend runs migrations and the
# MinIO bucket is created automatically, so a fresh checkout works with no manual setup.
#
# Not in prod (removed): Kafka, Zookeeper, RabbitMQ, Celery. Background work runs in-process
# via asyncio (app/services/task_runner.py).

services:
  # Redis — rate-limit storage / cache (REDIS_ENABLED)
  redis:
    image: redis:7-alpine
    container_name: scribely-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # PostgreSQL — listens on 5435 (not the default 5432) so the port is 5435 everywhere:
  # host tools use localhost:5435 (matches backend/.env) and the backend uses postgres:5435.
  postgres:
    image: postgres:15-alpine
    container_name: scribely-postgres
    command: ["postgres", "-p", "5435"]
    environment:
      POSTGRES_DB: scribely
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5435"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5435"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO — S3-compatible object storage (meeting recordings/transcripts mirror)
  minio:
    image: minio/minio
    container_name: scribely-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: create the bucket the backend expects (it does not auto-create it).
  minio-init:
    image: minio/mc
    container_name: scribely-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/scribely &&
      echo 'MinIO bucket scribely ready'
      "
    restart: "no"

  # FastAPI Backend (AssistMe — www.api.scribely.xyz in prod)
  # IMPORTANT: build context is the repo ROOT — backend/Dockerfile does `COPY backend/ ./`
  # and the root .dockerignore is written for root-context builds.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: scribely-backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    # Secrets (Clerk, OpenAI/OpenRouter, Recall, Langfuse, VAPID, …) come from backend/.env.
    env_file:
      - ./backend/.env
    # Infra URLs use compose-network hostnames and OVERRIDE whatever is in backend/.env.
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5435/scribely
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: scribely
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
      ENVIRONMENT: development
      LOG_LEVEL: info
    # Apply DB migrations on boot (fresh Postgres has no tables), then serve.
    command:
      - /bin/sh
      - -c
      - /app/.venv/bin/python -m alembic upgrade head && exec /app/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  # Next.js Frontend (scribely.xyz in prod). NEXT_PUBLIC_* are baked at BUILD time, so they
  # must be build args (runtime env can't change an already-built bundle).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    container_name: scribely-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    # Server-side Clerk (middleware/SSR) needs CLERK_SECRET_KEY + CLERK_JWKS_URL at RUNTIME.
    # NEXT_PUBLIC_* are baked at build time (above); the secret is NOT and must be injected here.
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  default:
    name: scribely-network
    driver: bridge
