version: '3.8'

# Local stack mirrors Railway prod: Redis + Postgres + Backend (AssistMe) + Frontend + MinIO.
# Removed (unused): Kafka, Zookeeper, RabbitMQ, all Celery workers, Flower, Nginx.
# Background work runs in-process via asyncio (app/services/task_runner.py), not Celery.

services:
  # Redis — rate-limit storage / cache (enable via REDIS_ENABLED)
  redis:
    image: redis:7-alpine
    container_name: scribely-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # PostgreSQL — host port 5435 to match backend/.env (DATABASE_URL=...@localhost:5435)
  postgres:
    image: postgres:15-alpine
    container_name: scribely-postgres
    environment:
      POSTGRES_DB: scribely
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MinIO — S3-compatible object storage (meeting recordings/transcripts mirror)
  minio:
    image: minio/minio
    container_name: scribely-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend (AssistMe — www.api.scribely.xyz in prod)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scribely-backend
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Service URLs use the compose network hostnames (internal ports)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/scribely
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      # Object storage (MinIO)
      OBJECT_STORAGE_ENABLED: "true"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: scribely
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      S3_USE_PATH_STYLE: "true"
      ENVIRONMENT: development
      LOG_LEVEL: info
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Next.js Frontend (scribely.xyz in prod)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scribely-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_NAME: "Scribely"
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  default:
    name: scribely-network
    driver: bridge
