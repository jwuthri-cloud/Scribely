<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AssistMe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .header .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }

    .header .dot.connected {
      background: #4caf50;
      box-shadow: 0 0 6px rgba(76, 175, 80, 0.5);
    }

    .header .dot.capturing {
      background: #f44336;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
      font-size: 12px;
    }

    .status-bar .label {
      color: #888;
    }

    .status-bar .value {
      color: #ccc;
      font-weight: 500;
    }

    .status-bar .value.ok {
      color: #4caf50;
    }

    .status-bar .value.err {
      color: #f44336;
    }

    .tab-info {
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
      font-size: 12px;
      color: #bbb;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-info .tab-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
      font-weight: 500;
    }

    .tab-info .tab-icon {
      width: 16px;
      height: 16px;
      border-radius: 3px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:hover {
      filter: brightness(1.1);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-start {
      background: #4caf50;
      color: #fff;
    }

    .btn-stop {
      background: #f44336;
      color: #fff;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(244, 67, 54, 0.15);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #f44336;
      font-size: 11px;
      margin-bottom: 12px;
    }

    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <div id="statusDot" class="dot"></div>
    <h1>AssistMe Tab Capture</h1>
  </div>

  <div class="status-bar">
    <span class="label">Desktop app:</span>
    <span id="wsStatus" class="value">Checking...</span>
  </div>

  <div class="tab-info">
    <img id="tabIcon" class="tab-icon" src="" alt="" style="display:none">
    <span id="tabName" class="tab-name">Loading...</span>
  </div>

  <div id="errorBox" class="error" style="display:none"></div>

  <button id="captureBtn" class="btn btn-start" disabled>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <circle cx="12" cy="12" r="8"/>
    </svg>
    <span id="captureBtnText">Start Sharing</span>
  </button>

  <div class="footer">
    Streams tab audio &amp; video to AssistMe for transcription
  </div>

  <script src="popup.js"></script>
</body>
</html>
